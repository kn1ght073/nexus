[package]
name = "nexus-desktop"
version = "0.1.0"
description = "NEXUS Desktop — Tauri 2 shell for the NEXUS Personal Digital Infrastructure"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
