[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-cli"
version = "0.1.0"
description = "Power Tools for the NEXUS Ecosystem"
dependencies = [
    "typer==0.9.0",
    "rich==13.7.0",
    "requests==2.31.0",
    "pydantic==2.4.2",
    "textual"
]

[project.scripts]
nexus = "main:app"

[tool.setuptools]
py-modules = ["main", "config", "tui"]
