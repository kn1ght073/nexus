[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-cli"
version = "0.2.0"
description = "World-Class Developer CLI & Edge Node Controller for NEXUS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "pydantic>=2.4.2",
    "keyring>=25.0.0",
    "textual>=0.50.0"
]

[project.scripts]
nexus = "nexus_cli.cli:app"

[tool.setuptools]
py-modules = ["main", "config", "tui"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_cli*"]

[tool.setuptools.package-data]
"nexus_cli.tui" = ["*.tcss"]
