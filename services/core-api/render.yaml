# Render blueprint: NEXUS control plane (free tier).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Render reads services/core-api/render.yaml and provisions the web service;
# add the env vars below in the dashboard after the first deploy.
services:
  - type: web
    name: nexus-control-plane
    runtime: docker
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: ./services/core-api          # context: services/core-api/
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- set these in the Render dashboard (values are secrets) ---
      - key: NEXUS_CONTROL_PLANE_MODE
        value: "true"
      - key: NEXUS_PUBLIC_URL
        value: "https://nexus-control-plane-uvi8.onrender.com"
      - key: NEXUS_ALLOW_PASSWORD_AUTH
        value: "true"
      - key: NEXUS_DATABASE_URL
        sync: false                        # paste your Neon/Supabase Postgres URL
      - key: NEXUS_JWT_SECRET
        sync: false                        # e.g. output of: python -c "import secrets; print(secrets.token_hex(32))"
      - key: NEXUS_CORS_ORIGINS
        sync: false                        # e.g. ["https://nexus-control.onrender.com", "tauri://localhost"]
      - key: NEXUS_STORAGE_ROOTS
        value: "[]"                        # control plane never serves files
      - key: NEXUS_NODE_HEARTBEAT_TIMEOUT
        value: "90"
      - key: NEXUS_ALLOWED_GOOGLE_EMAILS
        sync: false                        # comma-separated list of allowed Google emails
      - key: NEXUS_GOOGLE_CLIENT_ID
        sync: false                        # Google OAuth Client ID
      - key: NEXUS_GOOGLE_CLIENT_SECRET
        sync: false                        # Google OAuth Client Secret (CP only)
      - key: NEXUS_GOOGLE_REDIRECT_URI
        sync: false                        # e.g. https://nexus-control.onrender.com/api/auth/google/callback
